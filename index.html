<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Organisez toutes vos escapades dans des carnets de voyage simples et personnels.">
  <title>Mes carnets de voyage</title>
  <style>
    :root{--ink:#17342d;--muted:#61766f;--paper:#fffdf7;--cream:#f4efe2;--coral:#e36d52;--sun:#f2be5c;--sea:#4e8d89;--line:#ded8ca;--shadow:0 18px 45px rgba(32,54,45,.12)}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--cream)}
    button,input,textarea{font:inherit}button{cursor:pointer}.topbar{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:22px clamp(20px,6vw,76px);border-bottom:1px solid var(--line);background:rgba(255,253,247,.92);position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}
    .brand{display:flex;align-items:center;gap:12px;font-family:Georgia,serif;font-size:1.15rem;font-weight:700}.brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;color:white;background:var(--coral);transform:rotate(-5deg)}
    .add{border:0;border-radius:999px;padding:11px 18px;color:white;background:var(--ink);font-weight:700;box-shadow:0 8px 18px rgba(23,52,45,.18)}.add:hover{background:#265548}.add:focus-visible,.delete:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid rgba(242,190,92,.65);outline-offset:2px}
    main{width:min(1160px,calc(100% - 36px));margin:0 auto;padding:70px 0 90px}.intro{display:grid;grid-template-columns:1.4fr .6fr;gap:42px;align-items:end;margin-bottom:48px}.eyebrow{margin:0 0 8px;color:var(--coral);font-weight:800;letter-spacing:.13em;text-transform:uppercase;font-size:.75rem}.intro h1{max-width:780px;margin:0;font:clamp(2.8rem,7vw,6.4rem)/.93 Georgia,serif;letter-spacing:-.055em}.intro p{margin:0 0 8px;color:var(--muted);font-size:1.05rem}
    .count{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:var(--paper);font-size:.85rem;font-weight:700}.count::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sun)}
    .grid{display:grid;gap:30px}.card{overflow:hidden;border:1px solid var(--line);border-radius:28px;background:var(--paper);box-shadow:var(--shadow)}.card-head{display:grid;grid-template-columns:1.1fr .72fr .68fr;min-height:240px}.cover{position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:34px;background:linear-gradient(135deg,#397a76,#75aaa2);color:white;overflow:hidden}.cover::before{content:"✦";position:absolute;right:36px;top:22px;font-size:8rem;color:rgba(255,255,255,.12);transform:rotate(18deg)}.cover small{position:relative;text-transform:uppercase;letter-spacing:.14em;font-weight:800}.cover input{position:relative;width:100%;margin-top:8px;border:0;border-bottom:1px solid rgba(255,255,255,.45);padding:2px 0 8px;color:white;background:transparent;font:clamp(2rem,5vw,4rem)/1 Georgia,serif}.cover input::placeholder{color:rgba(255,255,255,.72)}.map-card{position:relative;min-height:240px;background:#dce9e5;overflow:hidden}.map-card iframe{display:block;width:100%;height:100%;min-height:240px;border:0;filter:saturate(.75) contrast(.94)}.map-label{position:absolute;left:12px;bottom:12px;z-index:2;display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;color:var(--ink);background:rgba(255,253,247,.92);box-shadow:0 4px 15px rgba(23,52,45,.18);font-size:.74rem;font-weight:800;text-decoration:none;backdrop-filter:blur(8px)}.map-label:hover{background:white}
    .date-block{display:flex;flex-direction:column;justify-content:center;padding:34px;background:#f4c96f}.date-block label{font-size:.75rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase}.date-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.date-row input{min-width:0;border:1px solid rgba(23,52,45,.18);border-radius:12px;padding:11px;background:rgba(255,255,255,.6);color:var(--ink)}
    .details{display:grid;grid-template-columns:1.15fr .85fr .85fr;gap:0;border-top:1px solid var(--line)}.section{padding:30px;border-right:1px solid var(--line)}.section:last-child{border-right:0}.section-title{display:flex;align-items:center;gap:10px;margin:0 0 16px;font:1.15rem Georgia,serif}.icon{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#e9f2ef}.section textarea,.section input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;color:var(--ink);background:white}.section textarea{min-height:112px;resize:vertical}.section input+input{margin-top:9px}.hint{display:block;margin-top:9px;color:var(--muted);font-size:.78rem}.card-actions{display:flex;justify-content:flex-end;padding:0 24px 22px}.delete{border:0;padding:7px 10px;color:#a34737;background:transparent;font-size:.82rem}.delete:hover{text-decoration:underline}
    .empty{display:none;text-align:center;padding:65px 20px;border:1px dashed #b8afa0;border-radius:24px;color:var(--muted);background:rgba(255,255,255,.35)}.empty strong{display:block;color:var(--ink);font:1.5rem Georgia,serif;margin-bottom:4px}
    .save-note{position:fixed;right:18px;bottom:18px;padding:9px 13px;border-radius:999px;color:white;background:var(--ink);font-size:.78rem;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}.save-note.show{opacity:1;transform:none}
    @media(max-width:800px){.topbar{padding:16px 18px}.brand span:last-child{display:none}main{padding-top:44px}.intro{grid-template-columns:1fr;gap:18px}.card-head,.details{grid-template-columns:1fr}.date-block{min-height:190px}.section{border-right:0;border-bottom:1px solid var(--line)}.section:last-child{border-bottom:0}.add{padding:10px 13px}.add .wide{display:none}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">↗</span><span>Mes carnets de voyage</span></div>
    <button class="add" id="addTrip" type="button">＋ <span class="wide">Nouveau carnet</span></button>
  </header>
  <main>
    <section class="intro">
      <div><p class="eyebrow">Escapades à venir</p><h1>Partir commence ici.</h1></div>
      <div><p>Rassemblez vos idées, réservations et incontournables dans un carnet par voyage.</p><span class="count" id="count">1 carnet</span></div>
    </section>
    <div class="grid" id="tripGrid"></div>
    <div class="empty" id="empty"><strong>Aucun voyage pour le moment</strong>Créez votre premier carnet et commencez à rêver.</div>
  </main>
  <div class="save-note" id="saveNote">Modifications enregistrées</div>

  <template id="tripTemplate">
    <article class="card">
      <div class="card-head">
        <div class="cover"><small>Destination</small><input data-field="destination" aria-label="Destination" placeholder="Où partez-vous ?"></div>
        <div class="map-card"><iframe title="Carte de la destination" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe><a class="map-label" target="_blank" rel="noopener">⌖ Voir la carte</a></div>
        <div class="date-block"><label>Dates prévues</label><div class="date-row"><input data-field="start" type="date" aria-label="Date de départ"><input data-field="end" type="date" aria-label="Date de retour"></div></div>
      </div>
      <div class="details">
        <section class="section"><h2 class="section-title"><span class="icon">⌖</span> À voir & à faire</h2><textarea data-field="activities" aria-label="Activités et lieux prévus" placeholder="Musées, balades, restaurants, plages…"></textarea><span class="hint">Une idée par ligne, pour garder l'essentiel sous les yeux.</span></section>
        <section class="section"><h2 class="section-title"><span class="icon">➜</span> Transport</h2><input data-field="transport" aria-label="Moyen de transport" placeholder="Train, avion, voiture…"><input data-field="transportDetails" aria-label="Détails du transport" placeholder="Horaires ou référence"><span class="hint">Le trajet pour vous y rendre.</span></section>
        <section class="section"><h2 class="section-title"><span class="icon">⌂</span> Logement</h2><input data-field="lodging" aria-label="Nom du logement" placeholder="Hôtel, location…"><input data-field="address" aria-label="Adresse du logement" placeholder="Adresse ou quartier"><span class="hint">Votre point de chute sur place.</span></section>
      </div>
      <div class="card-actions"><button class="delete" type="button">Supprimer ce carnet</button></div>
    </article>
  </template>

  <script>
    const key='mes-carnets-voyage-v1', grid=document.querySelector('#tripGrid'), template=document.querySelector('#tripTemplate'), count=document.querySelector('#count'), empty=document.querySelector('#empty'), note=document.querySelector('#saveNote');
    const sample={destination:'Lisbonne',start:'2026-09-12',end:'2026-09-17',activities:'Tram 28 et quartier de l’Alfama\nMonastère des Hiéronymites\nCoucher de soleil au Miradouro da Senhora',transport:'Avion',transportDetails:'Vol du matin',lodging:'Casa da Baixa',address:'Quartier de Baixa'};
    let trips; try{trips=JSON.parse(localStorage.getItem(key))||[sample]}catch{trips=[sample]}
    function save(){localStorage.setItem(key,JSON.stringify(trips));note.classList.add('show');clearTimeout(save.timer);save.timer=setTimeout(()=>note.classList.remove('show'),1100)}
    function updateMap(card,destination){const place=(destination||'France').trim(),query=encodeURIComponent(place),frame=card.querySelector('.map-card iframe'),link=card.querySelector('.map-label');frame.src=`https://www.google.com/maps?q=${query}&output=embed`;link.href=`https://www.google.com/maps/search/?api=1&query=${query}`;frame.title=`Carte de ${place}`}
    function render(){grid.innerHTML='';trips.forEach((trip,index)=>{const node=template.content.cloneNode(true),card=node.querySelector('.card');card.querySelectorAll('[data-field]').forEach(el=>{const field=el.dataset.field;el.value=trip[field]||'';let mapTimer;el.addEventListener('input',()=>{trips[index][field]=el.value;save();if(field==='destination'){clearTimeout(mapTimer);mapTimer=setTimeout(()=>updateMap(card,el.value),500)}})});updateMap(card,trip.destination);card.querySelector('.delete').addEventListener('click',()=>{if(confirm('Supprimer ce carnet de voyage ?')){trips.splice(index,1);save();render()}});grid.appendChild(node)});count.textContent=`${trips.length} carnet${trips.length!==1?'s':''}`;empty.style.display=trips.length?'none':'block'}
    document.querySelector('#addTrip').addEventListener('click',()=>{trips.push({});save();render();requestAnimationFrame(()=>{const cards=grid.querySelectorAll('.card'),last=cards[cards.length-1];last.scrollIntoView({behavior:'smooth',block:'center'});last.querySelector('input').focus()})});
    render();
  </script>
</body>
</html>
